name: ReaderInteraction
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ReaderHarness:
    type: application
    platform: iOS
    sources:
      - path: Harness.swift
      - path: ChapterHarness.swift
      - path: AnimationProbe.swift
      - path: VolumeHarness.swift
      - path: TypographyHarness.swift
      - path: ../../Sources/App/CommentViews.swift
      - path: ../../Sources/App/ReaderTextLayout.swift
      - path: ../../Sources/App/PageTurnView.swift
      - path: ../../Sources/App/PageTurnCoordinator.swift
      - path: ../../Sources/App/ReaderPageFace.swift
      - path: ../../Sources/App/ReaderPaginator.swift
      - path: ../../Sources/App/VolumeTitleView.swift
      - path: ../../Sources/App/ChapterTitleView.swift
      - path: ../../Sources/App/ReaderTypographyControls.swift
      - path: ../../Sources/Store/ReadSettings.swift
      - path: ../../Sources/Models/Models.swift
      - path: ../../Sources/App/InteractivePageTurnView.swift
      - path: ../../Sources/App/ReaderScrollBoundaryObserver.swift
      - path: ../../Sources/Engine/Paginator.swift
      - path: ../../Sources/Engine/ContentBlocks.swift
      - path: ../../Sources/Engine/ChapterNavigation.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.legado.readerharness
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  ReaderInteractionTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ReaderHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.legado.readerinteractiontests
        TEST_TARGET_NAME: ReaderHarness
schemes:
  ReaderHarness:
    build:
      targets:
        ReaderHarness: all
        ReaderInteractionTests: [test]
    test:
      targets:
        - ReaderInteractionTests
