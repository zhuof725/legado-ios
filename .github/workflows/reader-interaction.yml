name: Reader interaction test
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test scope
        type: choice
        default: smoke
        options: [smoke, continuity, scroll, typography, native, full]
  push:
    branches: [main, fix/source-compat-runtime]
    paths: ['Sources/App/CommentViews.swift', 'Sources/App/Reader*.swift', 'Sources/App/*PageTurn*.swift', 'Sources/App/Views.swift', 'Sources/App/VolumeTitleView.swift', 'Sources/App/ChapterTitleView.swift', 'Sources/Store/ReadSettings.swift', 'Sources/Engine/ChapterNavigation.swift', 'Tools/ReaderInteractionTest/**', '.github/workflows/reader-interaction.yml']
concurrency:
  group: reader-interaction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and diagnostic tools
        run: brew install xcodegen ripgrep
      - name: Generate focused test project
        run: cd Tools/ReaderInteractionTest && xcodegen generate
      - name: Pick available iPhone simulator
        run: |
          xcrun simctl list devices available -j > /tmp/devices.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          devices = json.load(open('/tmp/devices.json'))['devices']
          phones = [d for group in devices.values() for d in group if d['name'].startswith('iPhone')]
          assert phones
          print('SIMULATOR_ID=' + phones[0]['udid'])
          PY
      - name: Boot selected simulator
        run: |
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Test native reader interactions
        env:
          TEST_SUITE: ${{ inputs.suite || 'smoke' }}
        run: |
          set -o pipefail
          ARGS=()
          case "$TEST_SUITE" in
            typography) ARGS=(-only-testing:ReaderInteractionTests/TypographyTests/testNativeCJKColumnsBaselinesAndPagination) ;;
            native) ARGS=(-only-testing:ReaderInteractionTests/NativeReaderTests) ;;
            scroll) ARGS=(-only-testing:ReaderInteractionTests/ContinuousScrollTests) ;;
            continuity) ARGS=(-only-testing:ReaderInteractionTests/NativeReaderTests -only-testing:ReaderInteractionTests/ContinuousScrollTests -only-testing:ReaderInteractionTests/InteractionTests) ;;
            full) ;;
            *) ARGS=(-only-testing:ReaderInteractionTests/NativeReaderTests -only-testing:ReaderInteractionTests/ContinuousScrollTests -only-testing:ReaderInteractionTests/TypographyTests -only-testing:ReaderInteractionTests/InteractionTests) ;;
          esac
          xcodebuild -project Tools/ReaderInteractionTest/ReaderInteraction.xcodeproj \
            -scheme ReaderHarness -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 "${ARGS[@]}" \
            -resultBundlePath reader-interaction.xcresult CODE_SIGNING_ALLOWED=NO test \
            2>&1 | tee reader-interaction.log
      - name: Print crash diagnostics on failure
        if: failure()
        run: |
          set +e
          xcrun xcresulttool export diagnostics --path reader-interaction.xcresult --output-path diagnostics >/dev/null 2>&1
          python3 - <<'PY'
          import subprocess, pathlib, zipfile
          files = subprocess.run(['rg', '--files', '-uuu', 'diagnostics'], text=True, capture_output=True).stdout.splitlines()
          def report(name, raw):
              if 'harness' not in name.lower(): return
              needles = ['terminating app', 'reason:', 'uncaught exception', 'reader-exception', 'lastExceptionBacktrace']
              for line in raw.decode('utf-8', 'replace').splitlines():
                  if any(word.lower() in line.lower() for word in needles):
                      print('CRASH>', name, line[:9000])
          for name in files:
              path = pathlib.Path(name)
              if path.suffix in ['.txt', '.ips', '.crash']:
                  report(name, path.read_bytes())
              elif path.suffix == '.zip':
                  try:
                      with zipfile.ZipFile(path) as z:
                          for entry in z.namelist():
                              if 'harness' in entry.lower(): report(entry, z.read(entry))
                  except Exception as error: print('diagnostics error', error)
          PY
      - name: Export reader screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path reader-interaction.xcresult --output-path reader-screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-interaction-results
          path: |
            reader-interaction.log
            reader-interaction.xcresult
            reader-screenshots
