name: Source test

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      key:
        description: 搜索关键词
        default: 斗罗大陆

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          X=$(ls -d /Applications/Xcode_1[6-9]*.app /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -n 1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          swift --version

      - name: Prepare package
        run: |
          P=$RUNNER_TEMP/pkg
          mkdir -p $P/Sources/SourceTest
          cp Sources/Engine/*.swift Sources/Models/*.swift $P/Sources/SourceTest/
          cp Tools/SourceTest/*.swift $P/Sources/SourceTest/
          cat > $P/Package.swift <<'EOF'
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(
            name: "SourceTest",
            platforms: [.macOS(.v13)],
            dependencies: [.package(url: "https://github.com/scinfu/SwiftSoup.git", from: "2.7.0"), .package(url: "https://github.com/tid-kijyun/Kanna.git", from: "5.2.7")],
            targets: [.executableTarget(name: "SourceTest", dependencies: ["SwiftSoup", "Kanna"])]
          )
          EOF
          sed -i '' 's/^          //' $P/Package.swift
          cat $P/Package.swift

      - name: Build
        run: |
          set -o pipefail
          cd $RUNNER_TEMP/pkg
          swift build -c release 2>&1 | tee $GITHUB_WORKSPACE/test-build.log

      - name: Fixed rule regression
        run: |
          set -o pipefail
          $RUNNER_TEMP/pkg/.build/release/SourceTest --regression 2>&1 | tee regression.log

      - name: Download sources
        if: github.event_name == 'workflow_dispatch'
        run: curl -sSL --retry 3 https://cdn.jsdelivr.net/gh/XIU2/Yuedu@master/shuyuan -o sources.json && ls -la sources.json

      - name: Run test
        if: github.event_name == 'workflow_dispatch'
        env:
          TEST_KEY: ${{ github.event.inputs.key }}
        run: |
          set -o pipefail
          KEY="$TEST_KEY"
          [ -z "$KEY" ] && KEY=斗罗大陆
          $RUNNER_TEMP/pkg/.build/release/SourceTest sources.json "$KEY" 60 2>&1 | tee source-test.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-test-log
          path: |
            source-test.log
            regression.log
            test-build.log
            dumps/
